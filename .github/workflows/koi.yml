
name: Exploring Koi

on:
  schedule:
    - cron: '20 0 * * *'

  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/koi.yml'
      - 'scripts/koi_motion.py'

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate original activity-based koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi

      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'

      - name: Generate natural swimming animation
        run: python scripts/koi_motion.py

      - name: Commit updated GIFs
        shell: bash
        run: |
          git add koi/koi.gif koi/koi-explorer.gif

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update naturally swimming koi"
          git push
