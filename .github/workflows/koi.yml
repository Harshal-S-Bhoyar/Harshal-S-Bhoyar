name: Generate koi animation

on:
  workflow_dispatch:            # lets you press "Run workflow" manually
  push:
    paths:
      - "scripts/koi_motion.py"
      - "assets/koi.png"
      - ".github/workflows/koi.yml"

permissions:
  contents: write               # needed so the workflow can commit the GIF back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pillow numpy

      - name: Generate koi GIF
        run: python scripts/koi_motion.py

      - name: Commit GIF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/koi.gif
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update koi animation"
            git push
          fi
