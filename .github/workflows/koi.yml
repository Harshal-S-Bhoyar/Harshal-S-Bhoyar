
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate original Git Koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          login: Harshal-S-Bhoyar
          body: white
          output-dir: koi

      - name: Commit updated koi
        shell: bash
        run: |
          git add koi/koi.gif

          if git diff --cached --quiet; then
            echo "No changes to koi."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Git Koi"
          git push
